
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Handling System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>File Handling System</h1>
        <p class="subtitle">Create, append, and read your text files</p>

        <div class="form-group">
            <label for="fname">File Name</label>
            <input type="text" id="fname" placeholder="Example: abc.txt">
        </div>

        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" placeholder="Enter your content here..."></textarea>
        </div>

        <div class="buttons">
            <button onclick="writeFile()">Create File</button>
            <button onclick="appendFile()">Append Content</button>
            <button onclick="readFile()">Read File</button>
        </div>

        <div id="message"></div>

        <div class="output-section">
            <h2>File Output</h2>
            <pre id="output">Your file content will appear here...</pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
