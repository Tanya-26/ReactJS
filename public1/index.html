<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create a file</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-body-tertiary">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <section class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
              <h1 class="h3 card-title mb-2">Create a file</h1>
              <p class="text-body-secondary mb-4">Enter a file name and the content to save.</p>

              <div class="mb-3">
                <label class="form-label" for="fname">File name</label>
                <input
                  class="form-control"
                  id="fname"
                  type="text"
                  placeholder="example.txt"
                  required
                />
              </div>

              <div class="mb-4">
                <label class="form-label" for="content">Content</label>
                <textarea
                  class="form-control"
                  id="content"
                  rows="5"
                  placeholder="Enter your content here..."
                ></textarea>
              </div>

              <button class="btn btn-primary w-100" id="create-button" type="button">
                Create file
              </button>
              <p class="alert mt-3 mb-0 d-none" id="message" role="status" aria-live="polite"></p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script>
      const createButton = document.getElementById("create-button");
      const message = document.getElementById("message");

      createButton.addEventListener("click", async () => {
        const fname = document.getElementById("fname").value.trim();
        const content = document.getElementById("content").value;

        if (!fname) {
          message.className = "alert alert-danger mt-3 mb-0";
          message.textContent = "Please enter a file name.";
          return;
        }

        const query = new URLSearchParams({ fname, content });

        try {
          const response = await fetch(`/create?${query}`, { method: "GET" });
          const result = await response.text();

          if (!response.ok) {
            throw new Error(result);
          }

          message.className = "alert alert-success mt-3 mb-0";
          message.textContent = result;
        } catch (error) {
          message.className = "alert alert-danger mt-3 mb-0";
          message.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
